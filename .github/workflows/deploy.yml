name: Test Self-Hosted Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Destination Directory & Copy Image
        run: |
          # 1. Create subfolder inside /home/ubuntu if it doesn't exist
          mkdir -p /home/ubuntu/my-images

          # 2. Copy the image file from repo into destination directory
          cp path/to/your/image.png /home/ubuntu/my-images/

          # 3. Verify the file exists
          ls -la /home/ubuntu/my-images/
