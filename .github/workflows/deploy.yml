name: Test Self-Hosted Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Server Connection
        run: |
          echo "Successfully connected to self-hosted runner!"
          echo "Current user: $(whoami)"
          echo "Server hostname: $(hostname)"
          echo "Working directory: $(pwd)"

      - name: List Repository Files
        run: |
          echo "Files in repository:"
          ls -la
